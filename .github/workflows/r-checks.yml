name: R checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::readxl
            any::fixest
            any::here
            any::patchwork
            any::writexl
          cache-version: 1
      - name: Check calendar and validation rules
        run: Rscript tests/test_helpers.R
      - name: Run reports on synthetic data
        if: hashFiles('tests/test_reports.R') != ''
        run: Rscript tests/test_reports.R
      - name: Upload synthetic previews
        if: always() && hashFiles('outputs/figures/**/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-previews
          path: outputs/figures/variable_specific/
          retention-days: 7
